<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction 5 — Loud Luxury (Vogue-cover energy, brand-true)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --oxblood:#540918; --brass:#A8794A; --brass-warm:#C99A6C;
    --paper:#F5F1EC; --espresso:#171009;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:24px}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:
      radial-gradient(900px 760px at 50% 26%, #241812 0%, var(--espresso) 62%, #100b07 100%);
    display:flex;flex-direction:column;padding:96px 92px 84px;
  }
  /* ghosted numeral — depth, whispers the hook */
  .ghost{
    position:absolute;right:-40px;top:210px;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:400;
    font-size:640px;line-height:1;color:transparent;
    -webkit-text-stroke:1.5px rgba(201,154,108,.13);
    user-select:none;pointer-events:none;
  }
  .eyebrow{
    font-family:'Jost',sans-serif;font-weight:500;font-size:25px;
    letter-spacing:.4em;color:var(--brass-warm);text-transform:uppercase;
  }
  .eyebrow::after{
    content:"";display:block;width:72px;height:1px;background:var(--brass);
    margin-top:28px;
  }
  .headline{margin-top:88px;position:relative}
  .line{
    font-family:'Playfair Display',serif;color:var(--paper);
    font-weight:400;font-size:84px;line-height:1.16;letter-spacing:.002em;
  }
  .struck{
    font-style:italic;color:rgba(245,241,236,.5);position:relative;
    white-space:nowrap;
  }
  .struck::after{
    content:"";position:absolute;left:-2%;right:-2%;top:56%;height:3px;
    background:var(--oxblood);transform:rotate(-1.1deg);
    box-shadow:0 0 0 .5px rgba(201,154,108,.35);
  }
  .days{
    display:inline-block;margin:26px 0 18px;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:500;
    font-size:196px;line-height:1;color:var(--paper);
    background:var(--oxblood);padding:8px 44px 30px 36px;
    box-shadow:inset 0 0 0 1px rgba(201,154,108,.5), inset 0 0 0 7px var(--oxblood), inset 0 0 0 8px rgba(201,154,108,.35);
  }
  .subtitle{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:400;
    font-size:33px;line-height:1.5;color:var(--brass-warm);
    margin-top:72px;max-width:700px;
  }
  .folio{
    margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid rgba(168,121,74,.4);padding-top:38px;
  }
  .folio .who{
    font-family:'Jost',sans-serif;font-weight:500;font-size:22px;
    letter-spacing:.32em;color:var(--paper);text-transform:uppercase;
  }
  .folio .swipe{
    font-family:'Playfair Display',serif;font-style:italic;font-size:26px;
    color:var(--brass-warm);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="ghost">45</div>
  <div class="eyebrow">Buyer Process — Florida 2026</div>
  <div class="headline">
    <div class="line">Your offer was <span class="struck">accepted</span>.</div>
    <div class="line">The next</div>
    <div class="days">45 days</div>
    <div class="line">are where deals fall apart.</div>
  </div>
  <p class="subtitle">Five things most buyers don't know until they're already inside the transaction.</p>
  <div class="folio">
    <div class="who">Laurène · Fort Lauderdale</div>
    <div class="swipe">the five, in order —</div>
  </div>
</div>
</body>
</html>
