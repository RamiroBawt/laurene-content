<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction 7 — Loud Punch + Photo (graded full-bleed under the stack)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Jost:wght@500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --oxblood:#540918; --brass-warm:#C99A6C; --paper:#F5F1EC; --black:#0E0A08;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:24px}
  .slide{
    width:1080px;height:1350px;position:relative;overflow:hidden;
    background:var(--black);
    display:flex;flex-direction:column;padding:88px 80px 78px;
  }
  /* ——— photo layer: the grade lives HERE, not in the prompt ——— */
  .photo{position:absolute;inset:0;z-index:0}
  .photo img{
    width:100%;height:100%;object-fit:cover;object-position:center 30%;
    filter:grayscale(.45) contrast(1.3) brightness(.6) saturate(.8);
  }
  /* oxblood duotone pass */
  .photo .tint{
    position:absolute;inset:0;background:var(--oxblood);
    mix-blend-mode:soft-light;opacity:.75;
  }
  /* legibility scrim: heavier at top (headline) and bottom (folio) */
  .photo .scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(14,10,8,.82) 0%, rgba(14,10,8,.55) 38%,
                      rgba(14,10,8,.5) 60%, rgba(14,10,8,.9) 100%);
  }
  .content{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
  .eyebrow{
    font-family:'Jost',sans-serif;font-weight:600;font-size:25px;
    letter-spacing:.3em;color:rgba(245,241,236,.62);text-transform:uppercase;
  }
  .headline{margin-top:74px}
  .line{
    font-family:'Playfair Display',serif;font-weight:800;
    font-size:132px;line-height:1.04;color:var(--paper);
    letter-spacing:-.015em;
    text-shadow:0 2px 32px rgba(14,10,8,.55);
  }
  .struck{
    font-style:italic;font-weight:700;color:rgba(245,241,236,.45);
    position:relative;white-space:nowrap;
  }
  .struck::after{
    content:"";position:absolute;left:-3%;right:-3%;top:52%;height:11px;
    background:var(--oxblood);transform:rotate(-1.6deg);
    box-shadow:0 1px 10px rgba(0,0,0,.4);
  }
  .slab{
    display:inline-block;background:var(--oxblood);color:var(--paper);
    font-style:italic;padding:2px 34px 18px 26px;
    transform:rotate(-1.4deg);margin:10px 0 6px;
    box-shadow:0 14px 44px rgba(14,10,8,.5);
  }
  .kicker{
    margin-top:66px;font-family:'Jost',sans-serif;font-weight:500;
    font-size:35px;line-height:1.4;color:rgba(245,241,236,.9);max-width:840px;
    text-shadow:0 1px 14px rgba(14,10,8,.6);
  }
  .kicker b{color:var(--paper);font-weight:600}
  .scrawl{
    position:absolute;right:-2px;bottom:158px;
    font-family:'Caveat',cursive;font-weight:700;font-size:52px;
    color:var(--brass-warm);transform:rotate(-5deg);
    text-shadow:0 1px 12px rgba(14,10,8,.7);
  }
  .folio{
    margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid rgba(245,241,236,.22);padding-top:34px;
  }
  .folio .who{
    font-family:'Jost',sans-serif;font-weight:600;font-size:25px;
    letter-spacing:.22em;color:var(--paper);text-transform:uppercase;
  }
  .folio .swipe{
    font-family:'Jost',sans-serif;font-weight:500;font-size:26px;
    color:rgba(245,241,236,.6);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="photo">
    <img src="photo-coral-aerial.png" alt="">
    <div class="tint"></div>
    <div class="scrim"></div>
  </div>
  <div class="content">
    <div class="eyebrow">Buyer Process · Florida 2026</div>
    <div class="headline">
      <div class="line">Offer <span class="struck">accepted</span>.</div>
      <div class="line">The next <span class="slab">45 days</span></div>
      <div class="line">break deals.</div>
    </div>
    <p class="kicker">Five things buyers <b>don't find out</b> until they're already inside the transaction.</p>
    <div class="scrawl">most agents won't say this →</div>
    <div class="folio">
      <div class="who">Laurène · Fort Lauderdale</div>
      <div class="swipe">swipe ↠</div>
    </div>
  </div>
</div>
</body>
</html>
