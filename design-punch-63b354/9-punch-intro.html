<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punch Daylight 2/8 — intro strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Jost:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--oxblood:#540918;--brass:#A8794A;--paper:#F5F1EC;--ink:#1C1310;--taupe:#9F8E87}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:24px}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--paper);
    display:flex;flex-direction:column;padding:88px 80px 74px}
  .eyebrow{font-family:'Jost',sans-serif;font-weight:600;font-size:24px;letter-spacing:.3em;
    color:var(--oxblood);text-transform:uppercase}
  .big{margin-top:70px;font-family:'Playfair Display',serif;font-weight:800;font-size:108px;
    line-height:1.06;color:var(--ink);letter-spacing:-.015em}
  .big em{font-style:italic;font-weight:700;color:var(--oxblood)}
  .stat{align-self:flex-start;margin-top:64px;background:var(--oxblood);color:var(--paper);
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:74px;
    padding:4px 34px 16px 26px;transform:rotate(-1.4deg);box-shadow:0 16px 36px rgba(28,19,16,.18)}
  .stat small{display:block;font-family:'Jost',sans-serif;font-style:normal;font-weight:600;
    font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,241,236,.75);margin-top:4px}
  .data{margin-top:56px;font-family:'Jost',sans-serif;font-weight:400;font-size:33px;
    line-height:1.5;color:#4b4038;max-width:860px}
  .data b{color:var(--ink);font-weight:600}
  .scrawl{align-self:flex-end;margin-top:16px;font-family:'Caveat',cursive;font-weight:700;
    font-size:48px;color:var(--oxblood);transform:rotate(-4deg)}
  .folio{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid #C9C0B9;padding-top:30px}
  .folio .who{font-family:'Jost',sans-serif;font-weight:600;font-size:23px;letter-spacing:.22em;
    color:var(--ink);text-transform:uppercase}
  .folio .idx{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:var(--taupe)}
</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">The Setup</div>
  <div class="big">Getting the offer isn't the <em>hard part</em>.</div>
  <div class="stat">118–141 days<small>on market · my nine ZIPs</small></div>
  <p class="data">Offers <b>get accepted</b> in this market. The next 45 days are where prepared buyers separate from unprepared ones.</p>
  <div class="scrawl">five things nobody tells you →</div>
  <div class="folio">
    <div class="who">Laurène · Fort Lauderdale</div>
    <div class="idx">02 / 08</div>
  </div>
</div>
</body>
</html>
