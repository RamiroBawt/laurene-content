<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punch set 8/8 — closing (oxblood inversion)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Jost:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--oxblood:#540918;--brass-warm:#C99A6C;--paper:#F5F1EC;--black:#0E0A08}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:24px}
  /* inversion: the whole slide goes oxblood */
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;
    background:radial-gradient(880px 720px at 50% 32%, #641223 0%, var(--oxblood) 58%, #3d0611 100%);
    display:flex;flex-direction:column;padding:96px 84px 78px}
  .eyebrow{font-family:'Jost',sans-serif;font-weight:600;font-size:24px;letter-spacing:.3em;
    color:rgba(245,241,236,.6);text-transform:uppercase}
  .q{margin-top:110px;font-family:'Playfair Display',serif;font-weight:800;
    font-size:116px;line-height:1.08;color:var(--paper);letter-spacing:-.015em}
  .q em{font-style:italic;font-weight:700;color:var(--brass-warm)}
  .save{align-self:flex-start;margin-top:84px;background:var(--paper);color:var(--oxblood);
    font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:52px;
    padding:16px 40px 24px;transform:rotate(-1.2deg);
    box-shadow:0 18px 50px rgba(20,4,9,.5)}
  .scrawl{align-self:flex-end;margin-top:40px;font-family:'Caveat',cursive;font-weight:700;
    font-size:50px;color:var(--brass-warm);transform:rotate(-4deg)}
  .folio{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid rgba(245,241,236,.28);padding-top:32px}
  .folio .who{font-family:'Jost',sans-serif;font-weight:600;font-size:23px;letter-spacing:.22em;
    color:var(--paper);text-transform:uppercase}
  .folio .idx{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;color:rgba(245,241,236,.6)}
</style>
</head>
<body>
<div class="slide">
  <div class="eyebrow">Before You Write the Offer</div>
  <div class="q">Which of these would have caught you <em>off guard</em>?</div>
  <div class="save">Save this before your next offer.</div>
  <div class="scrawl">or send it to the friend who's house-hunting →</div>
  <div class="folio">
    <div class="who">Laurène · Fort Lauderdale</div>
    <div class="idx">08 / 08</div>
  </div>
</div>
</body>
</html>
