<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Direction 2 — Loud / Direct (her "stop the scroll" energy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,500;0,700;1,500&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --oxblood:#540918; --hot:#7A0C22; --paper:#F5F1EC; --ink:#141010; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center;padding:24px}
  .slide{
    width:1080px;height:1350px;background:var(--ink);position:relative;
    overflow:hidden;display:flex;flex-direction:column;padding:96px 76px 84px;
  }
  .tag{
    display:inline-block;align-self:flex-start;
    font-family:'Archivo',sans-serif;font-weight:700;font-size:24px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--paper);
    border:2px solid rgba(245,241,236,.5);padding:12px 22px;border-radius:999px;
  }
  h1{
    font-family:'Archivo Black',sans-serif;font-size:118px;line-height:.98;
    color:var(--paper);text-transform:uppercase;margin-top:70px;
    letter-spacing:-.015em;
  }
  h1 .accepted{color:rgba(245,241,236,.38);text-decoration:line-through;
    text-decoration-thickness:7px;text-decoration-color:var(--hot);}
  h1 .mark{
    background:var(--hot);color:var(--paper);padding:0 18px;
    display:inline-block;transform:rotate(-1.2deg);
  }
  .kicker{
    margin-top:64px;font-family:'Archivo',sans-serif;font-weight:500;
    font-size:36px;line-height:1.35;color:rgba(245,241,236,.82);max-width:820px;
  }
  .kicker b{color:#fff;font-weight:700}
  .scrawl{
    position:absolute;right:70px;bottom:200px;
    font-family:'Caveat',cursive;font-weight:700;font-size:54px;
    color:var(--hot);transform:rotate(-6deg);
  }
  .scrawl svg{position:absolute;left:-14px;right:-14px;bottom:-14px;width:calc(100% + 28px)}
  .bottom{
    margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    border-top:2px solid rgba(245,241,236,.18);padding-top:36px;
  }
  .bottom .who{font-family:'Archivo',sans-serif;font-weight:700;font-size:26px;
    letter-spacing:.08em;color:var(--paper);text-transform:uppercase}
  .bottom .cta{font-family:'Archivo',sans-serif;font-weight:500;font-size:26px;
    color:rgba(245,241,236,.6)}
</style>
</head>
<body>
<div class="slide">
  <div class="tag">Buyer Process · Florida 2026</div>
  <h1>
    Offer <span class="accepted">accepted</span>.<br>
    The next <span class="mark">45 days</span><br>
    break deals.
  </h1>
  <p class="kicker">Five things most buyers <b>don't know</b> until they're already inside the transaction.</p>
  <div class="scrawl">most agents won't say this →</div>
  <div class="bottom">
    <div class="who">Laurène · Fort Lauderdale</div>
    <div class="cta">swipe ↠</div>
  </div>
</div>
</body>
</html>
