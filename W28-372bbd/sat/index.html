<!DOCTYPE html>
<html lang="en">

<body class="page-day">
  <header class="day-header">
    <a href="../" class="day-header__back">&larr; W28</a>

  <footer class="page-footer">

  </footer>

  <script>
    // Copy-to-clipboard for caption / hashtag / hook blocks.
    document.querySelectorAll('.block__copy').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var target = document.querySelector(btn.dataset.copyTarget);
        if (!target) return;
        var text = target.textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1800);
          });
        } else {
          // Fallback for older Safari
          var range = document.createRange();
          range.selectNodeContents(target);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          try { document.execCommand('copy'); btn.textContent = 'Copied'; } catch (e) {}
          setTimeout(function () { btn.textContent = 'Copy'; sel.removeAllRanges(); }, 1800);
        }
      });
    });
  </script>
</body>
</html>
